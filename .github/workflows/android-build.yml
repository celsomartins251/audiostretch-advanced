name: Android build and beta release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare persistent signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/audiostretch-release.jks"
            echo "AUDIOSTRETCH_KEYSTORE_PATH=$RUNNER_TEMP/audiostretch-release.jks" >> "$GITHUB_ENV"
          else
            echo "Persistent signing key not configured; no installable beta release will be published."
          fi
      - name: Build debug APK
        env:
          AUDIOSTRETCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIOSTRETCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIOSTRETCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=0.1.${{ github.run_number }}-beta
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiostretch-advanced-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish beta release (requires persistent signing secrets)
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ github.event_name != 'pull_request' && env.HAS_KEYSTORE != '' && env.HAS_KEYSTORE_PASSWORD != '' && env.HAS_KEY_ALIAS != '' && env.HAS_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: AudioStretch Advanced Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Versão beta gerada automaticamente pelo GitHub Actions.
            Código de versão: ${{ github.run_number }}
