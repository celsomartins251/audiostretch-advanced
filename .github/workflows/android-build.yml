name: Android build and beta release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Assinatura persistente incompleta. Será gerado somente APK de diagnóstico; nenhuma release atualizável será publicada."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/audiostretch-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "AUDIOSTRETCH_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Assinatura persistente validada."

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          AUDIOSTRETCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIOSTRETCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIOSTRETCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=0.1.${{ github.run_number }}-beta
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/audiostretch-advanced-beta.apk"

      - name: Build unsigned-persistence diagnostic APK
        if: ${{ steps.signing.outputs.enabled != 'true' }}
        run: |
          gradle --no-daemon assembleDebug \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=0.1.${{ github.run_number }}-diagnostic

      - name: Upload signed release artifact
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: audiostretch-advanced-beta-signed
          path: ${{ runner.temp }}/audiostretch-advanced-beta.apk
          if-no-files-found: error

      - name: Upload diagnostic artifact
        if: ${{ steps.signing.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: audiostretch-advanced-diagnostic-only
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish beta release
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: AudioStretch Advanced Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/audiostretch-advanced-beta.apk
          body: |
            APK Android assinado com a chave persistente do AudioStretch.
            Código de versão: ${{ github.run_number }}
            applicationId de distribuição: br.com.celsomartins.audiostretch
