name: Android build and beta release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare persistent signing key (optional)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/audiostretch-release.jks"
            if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE" && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "AUDIOSTRETCH_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Persistent signing key validated."
            else
              rm -f "$KEYSTORE_FILE"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Persistent signing key is invalid. Continuing with an unsigned debug APK; beta release will be skipped."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing is incomplete. Building an unsigned debug APK; beta release will be skipped."
          fi
      - name: Build debug APK
        env:
          AUDIOSTRETCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUDIOSTRETCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUDIOSTRETCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=0.1.${{ github.run_number }}-beta
      - name: Prepare beta release APK filename
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/audiostretch-advanced-beta.apk"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiostretch-advanced-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish beta release (requires validated persistent signing)
        if: ${{ github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: AudioStretch Advanced Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/audiostretch-advanced-beta.apk
          body: |
            Versão beta gerada automaticamente pelo GitHub Actions.
            Código de versão: ${{ github.run_number }}
